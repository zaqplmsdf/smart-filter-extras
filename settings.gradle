pluginManagement {
    def useMirror = providers.gradleProperty('useNeoForgedMirror').map { it.toBoolean() }.getOrElse(false)
    repositories {
        maven {
            name = useMirror ? 'NeoForged (ForgeCDN mirror)' : 'NeoForged'
            url = useMirror ? 'https://neoforged.forgecdn.net/releases/' : 'https://maven.neoforged.net/releases/'
        }
        gradlePluginPortal()
    }
}

rootProject.name = 'smart-filter-extras'
