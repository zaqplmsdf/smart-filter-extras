org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

mod_id=smart_filter_extras
mod_name=Smart Filter Extras
mod_version=3.0.1
mod_group_id=smartfilterextras

minecraft_version=1.21.1
neoforge_version=21.1.248
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Dependencies used to compile and to run the dev client/server.
ffs_version=21.1.4
architectury_version=13.0.8
jei_version=19.57.0.450
# EMI 1.1.23 added the screen bounds API our integration needs (EMI only shows on non-container screens that use it).
emi_version=1.1.24+1.21.1
# Just Enough Characters 4.5.30 for 1.21.1 NeoForge (CurseForge file id), for testing pinyin search in dev runs.
jech_curse_file_id=9163765
# FTB Quests and what it needs to use FFS filters in item tasks (FTB XMod Compat holds the FFS adapter).
# The quest GameTests compile against these; -Pquests=true also puts them in the dev runs.
ftb_quests_version=2101.1.37
ftb_teams_version=2101.1.11
ftb_library_quests_version=2101.1.37
ftb_xmod_compat_version=21.1.13

# Version ranges written into neoforge.mods.toml.
# FTB Filter System 21.1.0-21.1.3 have an incompatible SmartFilter API (no HolderLookup.Provider parameters).
neoforge_version_range=[21.1.217,21.2)
minecraft_version_range=[1.21.1,1.21.2)
ffs_version_range=[21.1.4,21.2)
architectury_version_range=[13.0.8,14)

# Set to true to resolve NeoForged artifacts from the ForgeCDN mirror instead of maven.neoforged.net.
useNeoForgedMirror=false
