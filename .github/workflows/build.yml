name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # build: compiles, packages and writes .sha256 files; runGameTestServer: the server-side behaviour tests
      # (headless, fails the job if any test fails). The client smoke test needs a display, so it isn't run here.
      - name: Build and run GameTests
        run: ./gradlew build runGameTestServer --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: smart_filter_extras
          path: build/libs/
